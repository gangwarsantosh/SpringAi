name: Build and Deploy WAR to Tomcat EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TOMCAT_VERSION: 10.1.31
  TOMCAT_DIR: /opt/tomcat

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build WAR
        run: mvn clean package -DskipTests

      - name: Find WAR
        run: |
          WAR_FILE=$(find . -name "*.war" | head -1)

          if [ -z "$WAR_FILE" ]; then
            echo "WAR file not found"
            exit 1
          fi

          echo "WAR_FILE=$WAR_FILE" >> $GITHUB_ENV
          echo "Found: $WAR_FILE"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 Tomcat
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

          # Upload WAR
          scp -i ~/.ssh/ec2_key.pem \
            ${{ env.WAR_FILE }} \
            $EC2_USER@$EC2_HOST:/tmp/app.war

          # Deploy
          ssh -i ~/.ssh/ec2_key.pem $EC2_USER@$EC2_HOST << EOF
          set -e

          TOMCAT_VERSION="${TOMCAT_VERSION}"
          TOMCAT_DIR="${TOMCAT_DIR}"

          echo "=== JAVA CHECK ==="
          if ! command -v java >/dev/null 2>&1; then
            sudo yum install -y java-17-amazon-corretto || \
            sudo dnf install -y java-17-amazon-corretto
          fi

          java -version

          echo "=== TOMCAT CHECK ==="
          if [ ! -d "\$TOMCAT_DIR" ]; then
            wget -q https://archive.apache.org/dist/tomcat/tomcat-10/v\$TOMCAT_VERSION/bin/apache-tomcat-\$TOMCAT_VERSION.tar.gz

            sudo mkdir -p \$TOMCAT_DIR

            sudo tar -xzf apache-tomcat-\$TOMCAT_VERSION.tar.gz \
              -C \$TOMCAT_DIR \
              --strip-components=1

            sudo chmod +x \$TOMCAT_DIR/bin/*.sh

            rm -f apache-tomcat-\$TOMCAT_VERSION.tar.gz

            echo "Tomcat installed"
          else
            echo "Tomcat already installed"
          fi

          echo "=== STOP TOMCAT ==="
          sudo \$TOMCAT_DIR/bin/shutdown.sh || true
          sleep 10

          echo "=== DEPLOY WAR ==="
          sudo rm -rf \$TOMCAT_DIR/webapps/app*
          sudo rm -rf \$TOMCAT_DIR/work/*

          sudo mv /tmp/app.war \$TOMCAT_DIR/webapps/app.war

          echo "=== START TOMCAT ==="
          sudo \$TOMCAT_DIR/bin/startup.sh

          sleep 30

          echo "=== PROCESS CHECK ==="
          ps -ef | grep tomcat | grep -v grep || true

          echo "=== LAST 50 LOG LINES ==="
          sudo tail -50 \$TOMCAT_DIR/logs/catalina.out || true
          EOF

      - name: Verify Deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/ec2_key.pem $EC2_USER@$EC2_HOST << 'EOF'

          for i in {1..30}
          do
            STATUS=$(curl -s http://localhost:8080/app/actuator/health || true)

            if echo "$STATUS" | grep -q "UP"; then
              echo "APPLICATION HEALTHY"
              echo "$STATUS"
              exit 0
            fi

            echo "Waiting... ($i/30)"
            sleep 10
          done

          echo "APPLICATION FAILED"

          echo "========== CATALINA.OUT =========="
          sudo tail -200 /opt/tomcat/logs/catalina.out || true

          echo "========== LOG FILES =========="
          sudo ls -ltr /opt/tomcat/logs || true

          echo "========== ALL TOMCAT LOGS =========="
          sudo tail -100 /opt/tomcat/logs/*.log || true

          exit 1
          EOF

      - name: Summary
        run: |
          echo "Deployment completed"
          echo "App URL: http://${{ secrets.EC2_HOST }}:8080/app"
