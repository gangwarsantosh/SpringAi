name: Spring Boot CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  APP_NAME: Spring-Boot-App
  APP_ENV: DEV

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Print Environment Variables
        run: |
          echo "Application Name: $APP_NAME"
          echo "Environment: $APP_ENV"

      - name: Verify Secret Exists
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: echo "Secret loaded successfully"

      - name: Build, Test and Generate Coverage
        run: mvn clean verify

      - name: Debug Sonar Configuration
        run: |
          echo "Searching for Sonar configuration..."
          find . -name "sonar-project.properties"
          grep -R "localhost:9000" . || true
          grep -R "sonar.host.url" . || true

      - name: SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.host.url=https://sonarcloud.io

      - name: Show Build Output
        run: |
          find . -name "*.jar"
          find . -name "*.war"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-artifact
          path: |
            **/target/*.jar
            **/target/*.war
            target/site/jacoco/*